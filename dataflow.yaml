nodes:
  - id: gym_aloha
    path: python
    args: -m lerobot_trial.nodes.gym_aloha
    inputs:
      tick: dora/timer/millis/20  # 50 Hz control loop
      action: lerobot_server/action
      reset: lerobot_server/reset
    outputs:
      - agent_pos
    env:
      MJPEG_PORT: 8091

  - id: lerobot_server
    build: uv sync  # Ensure building with maturin
    path: python
    args: -m lerobot_trial.nodes.lerobot_server
    inputs:
      agent_pos: gym_aloha/agent_pos
    outputs:
      - action
      - reset
    env:
      HTTP_PORT: 8090
      MJPEG_PORT: 8091
