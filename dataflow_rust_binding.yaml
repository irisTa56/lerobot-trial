nodes:
  - id: gym_aloha
    path: python
    args: -m lerobot_trial.nodes.gym_aloha
    inputs:
      tick: dora/timer/millis/20  # 50 Hz control loop
      action: rust_binding/action
      reset: rust_binding/reset
    outputs:
      - agent_pos
    env:
      MJPEG_PORT: "8091"

  - id: rust_binding
    build: uv sync  # Ensure building with maturin
    path: python
    args: -m lerobot_trial.nodes.rust_binding
    inputs:
      agent_pos: gym_aloha/agent_pos
    outputs:
      - action
      - reset
    env:
      MJPEG_PORT: "8091"
      HTTP_PORT: "8000"
