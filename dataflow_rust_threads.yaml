nodes:
  - id: gym_aloha
    path: python
    args: -m lerobot_trial.nodes.gym_aloha
    inputs:
      tick: dora/timer/millis/20  # 50 Hz control loop
    outputs:
      - observation.state
      - observation.images.top

  - id: rust_threads
    build: uv sync  # Ensure building with maturin
    path: python
    args: -m lerobot_trial.nodes.rust_threads
    inputs:
      state: gym_aloha/observation.state
      image: gym_aloha/observation.images.top
